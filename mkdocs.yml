docs_dir: docs
extra_css:
- css/custom.css
nav:
- Home: index.md
- Documents:
  - Usage: usage.md
- API Reference: api.md
- Source Code: https://github.com/cloudmesh-ai/cloudmesh-ai-ssh
plugins:
- cloudmesh-ai-theme
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_section_style: table
          docstring_style: google
          group_by_category: true
          members: true
          separate_signature: true
          show_category_heading: true
          show_root_full_path: true
          show_source: true
          show_submodules: true
        paths:
        - src
site_name: Cloudmesh AI SSH

repo_url: https://github.com/cloudmesh-ai/cloudmesh-ai-ssh
repo_name: cloudmesh-ai-ssh

markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_style: colorful
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed
  - admonition
  - pymdownx.details
theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top

use_directory_urls: false